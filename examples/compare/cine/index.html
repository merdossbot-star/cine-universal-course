<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CINE alternative</title><style>body{margin:0;font-family:system-ui;background:#0b0d11;color:#eef0f4}main{padding:24px}.card{padding:20px;border:1px solid #333945;border-radius:16px;background:#131722}button{padding:10px 14px;border-radius:9px;border:0;font-weight:700}</style></head><body><main><div class="card"><p>Alternative native · CINE</p><h1 id="title">Hello CINE</h1><p>Le comportement est modélisé par une instance universelle.</p><button id="inc">Compteur <span id="count">0</span></button><p id="meta" style="font:11px ui-monospace,monospace;color:#a8adb7">instance: button.increment · progress: 0</p></div></main><script>const instances=new Map();const cine={create(spec){const x={...spec,variables:{...(spec.variables||{})}};instances.set(x.id,x);return x;}};const button=cine.create({id:'button.increment',kind:'event',target:'#inc',variables:{progress:0,count:0}});document.getElementById('inc').addEventListener('click',()=>{button.variables.count+=1;button.variables.progress=button.variables.count?1:0;document.getElementById('count').textContent=button.variables.count;document.getElementById('meta').textContent=`instance: ${button.id} · progress: ${button.variables.progress}`;});</script></body></html>
